name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: make bundle

      - name: Package
        run: |
          ditto -c -k --keepParent Octowatch.app "Octowatch-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "Octowatch-${GITHUB_REF_NAME}.zip" | tee "Octowatch-${GITHUB_REF_NAME}.zip.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Octowatch-${GITHUB_REF_NAME}.zip" \
            "Octowatch-${GITHUB_REF_NAME}.zip.sha256" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
